<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>添加老人 - 养老院管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <h2>添加老人</h2>
            <a href="/elder" class="btn">返回列表</a>
        </div>
        <form id="elderForm" class="form">
            <div class="form-group"><label>姓名</label><input type="text" id="name" required></div>
            <div class="form-group"><label>性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
            <div class="form-group"><label>出生日期</label><input type="date" id="birthday"></div>
            <div class="form-group"><label>身份证号</label><input type="text" id="idCard"></div>
            <div class="form-group"><label>联系电话</label><input type="text" id="phone"></div>
            <div class="form-group"><label>紧急联系人</label><input type="text" id="emergencyContact"></div>
            <div class="form-group"><label>紧急联系电话</label><input type="text" id="emergencyPhone"></div>
            <div class="form-group"><label>家庭地址</label><textarea id="address" rows="2"></textarea></div>
            <div class="form-group"><label>健康状况</label><textarea id="healthStatus" rows="2"></textarea></div>
            <div class="form-group"><label>分配房间</label>
                <select id="roomId">
                    <option value="">暂不分配</option>
                </select>
            </div>
            <div class="form-group"><label>床号</label><input type="text" id="bedNo"></div>
            <div class="modal-footer">
                <a href="/elder" class="btn">取消</a>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
<script>
    function loadRooms() {
        fetch('/room/list').then(res=>res.json()).then(data=>{
            if(data.code===200){
                const sel = document.getElementById('roomId');
                sel.innerHTML = '<option value="">暂不分配</option>';
                data.data.list.forEach(r => {
                    const remaining = r.capacity - r.occupied;
                    const statusText = r.status === 'AVAILABLE' ? '空闲' : r.status === 'FULL' ? '已满' : '维修';
                    sel.innerHTML += `<option value="${r.id}">${r.roomNo} | ${r.roomType} | 已住${r.occupied}/${r.capacity} | 剩余${remaining}床 | ${statusText}</option>`;
                });
            }
        });
    }
    loadRooms();

    document.getElementById('elderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // 空字符串转null，避免Jackson反序列化Date失败
        const strOrNull = (v) => v && v.trim() ? v.trim() : null;
        const intOrNull = (v) => { const p = parseInt(v); return isNaN(p) ? null : p; };

        const elder = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            birthday: strOrNull(document.getElementById('birthday').value),
            idCard: strOrNull(document.getElementById('idCard').value),
            phone: strOrNull(document.getElementById('phone').value),
            emergencyContact: strOrNull(document.getElementById('emergencyContact').value),
            emergencyPhone: strOrNull(document.getElementById('emergencyPhone').value),
            address: strOrNull(document.getElementById('address').value),
            healthStatus: strOrNull(document.getElementById('healthStatus').value),
            roomId: intOrNull(document.getElementById('roomId').value),
            bedNo: strOrNull(document.getElementById('bedNo').value)
        };
        fetch('/elder/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(elder)
        }).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(d => {
            alert(d.message);
            if (d.code === 200) window.location.href = '/elder';
        }).catch(err => {
            alert('请求失败：' + err.message);
        });
    });
</script>
</body>
</html>
