<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>访客管理 - 养老院管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .status-visiting { color: #4caf50; font-weight: bold; }
        .status-left { color: #9e9e9e; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 10px; width: 500px; max-width: 90%; padding: 30px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <h2>访客管理</h2>
            <button class="btn btn-primary" onclick="showAddModal()">+ 登记访客</button>
        </div>
        <table id="visitorTable">
            <thead><tr><th>访客姓名</th><th>身份证号</th><th>电话</th><th>被访老人</th><th>来访时间</th><th>离开时间</th><th>来访目的</th><th>操作</th></tr></thead>
            <tbody id="visitorTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 登记访客弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3>登记访客</h3><button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">&times;</button></div>
        <form id="visitorForm">
            <div class="form-group"><label>访客姓名</label><input type="text" id="visitorName" required></div>
            <div class="form-group"><label>身份证号</label><input type="text" id="idCard"></div>
            <div class="form-group"><label>联系电话</label><input type="text" id="phone"></div>
            <div class="form-group"><label>被访老人</label><select id="elderId" required><option value="">请选择</option></select></div>
            <div class="form-group"><label>来访目的</label><input type="text" id="purpose"></div>
            <div class="form-group"><label>备注</label><textarea id="remark" rows="2"></textarea></div>
        </form>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveVisitor()">确认登记</button>
        </div>
    </div>
</div>

<script>
    function loadVisitors() {
        fetch('/visitor/list').then(res=>res.json()).then(data=>{
            if(data.code===200) renderVisitors(data.data.list);
        });
    }
    function renderVisitors(records) {
        let html = '';
        records.forEach(r => {
            let cls = r.leaveTime ? 'status-left' : 'status-visiting';
            html += `<tr><td>${r.visitorName}</td><td>${r.idCard||'-'}</td><td>${r.phone||'-'}</td>
                <td>${r.elderName||'-'}</td><td>${r.visitTime||'-'}</td><td>${r.leaveTime||'未离开'}</td>
                <td>${r.purpose||'-'}</td>
                <td>${!r.leaveTime ? `<button class="btn btn-warning" onclick="leaveVisitor(${r.id})">登记离开</button>` : '-'}</td></tr>`;
        });
        document.getElementById('visitorTableBody').innerHTML = html;
    }
    function loadEldersForVisitor() {
        fetch('/elder/list').then(res=>res.json()).then(data=>{
            if(data.code===200){
                const sel = document.getElementById('elderId');
                data.data.list.forEach(e => { sel.innerHTML += `<option value="${e.id}">${e.name}</option>`; });
            }
        });
    }
    function showAddModal() { document.getElementById('visitorForm').reset(); document.getElementById('modal').style.display='flex'; }
    function closeModal() { document.getElementById('modal').style.display='none'; }
    function saveVisitor() {
        const record = {
            visitorName: document.getElementById('visitorName').value,
            idCard: document.getElementById('idCard').value,
            phone: document.getElementById('phone').value,
            elderId: parseInt(document.getElementById('elderId').value),
            purpose: document.getElementById('purpose').value,
            remark: document.getElementById('remark').value
        };
        fetch('/visitor/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(record) })
            .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(d=>{ alert(d.message); if(d.code===200){ closeModal(); loadVisitors(); } })
            .catch(err=>{ alert('请求失败：'+err.message); });
    }
    function leaveVisitor(id) {
        if(!confirm('确认该访客已离开？')) return;
        fetch(`/visitor/leave/${id}`, { method:'PUT' }).then(r=>r.json()).then(d=>{
            alert(d.message); if(d.code===200) loadVisitors();
        });
    }
    loadEldersForVisitor();
    loadVisitors();
</script>
</body>
</html>
