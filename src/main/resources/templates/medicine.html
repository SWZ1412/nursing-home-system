<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>药物管理 - 养老院管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <style>
        .warning { background-color: #fff3cd; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 10px; width: 550px; max-width: 90%; padding: 30px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <h2>药品库存管理</h2>
            <button class="btn btn-primary" onclick="showAddModal()">+ 添加药品</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="药品名称...">
            <button class="btn" onclick="searchMedicine()">搜索</button>
            <button class="btn btn-warning" onclick="showLowStock()">低库存预警</button>
            <button class="btn" onclick="loadMedicines()">显示全部</button>
        </div>
        <table id="medicineTable">
            <thead><tr><th>药品编号</th><th>名称</th><th>分类</th><th>规格</th><th>库存</th><th>最低库存</th><th>单价</th><th>有效期</th><th>操作</th></tr></thead>
            <tbody id="medicineTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 添加/编辑弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">添加药品</h3>
            <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">&times;</button>
        </div>
        <form id="medicineForm">
            <input type="hidden" id="medicineId">
            <div class="form-group"><label>药品名称</label><input type="text" id="medName" required></div>
            <div class="form-group"><label>分类</label>
                <select id="category">
                    <option value="">请选择</option>
                    <option value="心血管类">心血管类</option>
                    <option value="降糖类">降糖类</option>
                    <option value="降压类">降压类</option>
                    <option value="抗生素">抗生素</option>
                    <option value="维生素类">维生素类</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group"><label>规格</label><input type="text" id="specification" placeholder="如 10mg*30片"></div>
            <div class="form-group"><label>单位</label><input type="text" id="unit" placeholder="如 盒、瓶"></div>
            <div class="form-group"><label>单价</label><input type="number" step="0.01" id="medPrice" required></div>
            <div class="form-group"><label>库存数量</label><input type="number" id="stock" required></div>
            <div class="form-group"><label>最低库存预警</label><input type="number" id="minStock" value="10"></div>
            <div class="form-group"><label>生产厂家</label><input type="text" id="manufacturer"></div>
            <div class="form-group"><label>有效期</label><input type="date" id="expiryDate"></div>
            <div class="form-group"><label>描述</label><textarea id="medDescription" rows="2"></textarea></div>
        </form>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveMedicine()">保存</button>
        </div>
    </div>
</div>

<script>
    let currentEditId = null;

    function loadMedicines() {
        fetch('/medicine/list').then(res=>res.json()).then(data=>{
            if(data.code===200) renderTable(data.data.list);
        });
    }
    function renderTable(list) {
        let html = '';
        list.forEach(m => {
            let rowClass = m.stock < m.minStock ? 'warning' : '';
            html += `<tr class="${rowClass}">
                    <td>${m.medicineNo}</td><td>${m.name}</td><td>${m.category||'-'}</td>
                    <td>${m.specification||'-'}</td><td>${m.stock}</td><td>${m.minStock||'-'}</td>
                    <td>¥${m.price}</td><td>${m.expiryDate||'-'}</td>
                    <td><button class="btn btn-warning" onclick="editMedicine(${m.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteMedicine(${m.id})">删除</button></td>
                </tr>`;
        });
        document.getElementById('medicineTableBody').innerHTML = html;
    }
    function showLowStock() {
        fetch('/medicine/lowstock').then(r=>r.json()).then(data=>{
            if(data.code===200) renderTable(data.data);
        });
    }
    function searchMedicine() {
        const keyword = document.getElementById('searchInput').value.trim();
        if(!keyword) { loadMedicines(); return; }
        fetch('/medicine/list').then(res=>res.json()).then(data=>{
            if(data.code===200) {
                const filtered = data.data.list.filter(m => m.name && m.name.includes(keyword));
                renderTable(filtered);
            }
        });
    }
    function showAddModal() {
        currentEditId = null;
        document.getElementById('modalTitle').innerText = '添加药品';
        document.getElementById('medicineForm').reset();
        document.getElementById('medicineId').value = '';
        document.getElementById('modal').style.display = 'flex';
    }
    function editMedicine(id) {
        currentEditId = id;
        fetch('/medicine/list').then(res=>res.json()).then(data=>{
            const m = data.data.list.find(m => m.id === id);
            if(m){
                document.getElementById('modalTitle').innerText = '编辑药品';
                document.getElementById('medicineId').value = m.id;
                document.getElementById('medName').value = m.name || '';
                document.getElementById('category').value = m.category || '';
                document.getElementById('specification').value = m.specification || '';
                document.getElementById('unit').value = m.unit || '';
                document.getElementById('medPrice').value = m.price || '';
                document.getElementById('stock').value = m.stock || '';
                document.getElementById('minStock').value = m.minStock || 10;
                document.getElementById('manufacturer').value = m.manufacturer || '';
                document.getElementById('expiryDate').value = m.expiryDate ? m.expiryDate.split('T')[0] : '';
                document.getElementById('medDescription').value = m.description || '';
                document.getElementById('modal').style.display = 'flex';
            }
        });
    }
    function saveMedicine() {
        const strOrNull = (v) => v && v.trim() ? v.trim() : null;
        const intOrNull = (v) => { const p = parseInt(v); return isNaN(p) ? null : p; };
        const floatOrNull = (v) => { const p = parseFloat(v); return isNaN(p) ? null : p; };

        const medicine = {
            id: intOrNull(document.getElementById('medicineId').value),
            name: document.getElementById('medName').value,
            category: strOrNull(document.getElementById('category').value),
            specification: strOrNull(document.getElementById('specification').value),
            unit: strOrNull(document.getElementById('unit').value),
            price: floatOrNull(document.getElementById('medPrice').value),
            stock: intOrNull(document.getElementById('stock').value),
            minStock: intOrNull(document.getElementById('minStock').value) || 10,
            manufacturer: strOrNull(document.getElementById('manufacturer').value),
            expiryDate: strOrNull(document.getElementById('expiryDate').value),
            description: strOrNull(document.getElementById('medDescription').value)
        };
        const url = medicine.id ? '/medicine/update' : '/medicine/add';
        const method = medicine.id ? 'PUT' : 'POST';
        fetch(url, { method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(medicine) })
            .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(d=>{ alert(d.message); if(d.code===200){ closeModal(); loadMedicines(); } })
            .catch(err=>{ alert('请求失败：'+err.message); });
    }
    function deleteMedicine(id) {
        if(!confirm('确定删除该药品吗？')) return;
        fetch(`/medicine/delete/${id}`, { method:'DELETE' }).then(r=>r.json()).then(d=>{
            alert(d.message); if(d.code===200) loadMedicines();
        });
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    loadMedicines();
</script>
</body>
</html>
