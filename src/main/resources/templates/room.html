<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>房间管理 - 养老院管理系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .status-available { color: green; font-weight: bold; }
        .status-full { color: orange; }
        .status-maintenance { color: red; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 10px;
            width: 500px;
            max-width: 90%;
            padding: 30px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main-content">
        <div class="page-header">
            <h2>房间管理</h2>
            <button class="btn btn-primary" onclick="showAddModal()">+ 添加房间</button>
        </div>
        <table id="roomTable">
            <thead>
            <tr><th>房间号</th><th>楼栋</th><th>楼层</th><th>类型</th><th>容纳人数</th><th>已住</th><th>月租(元)</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="roomTableBody"></tbody>
        </table>
    </div>
</div>

<!-- 添加/编辑弹窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">添加房间</h3>
            <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;">&times;</button>
        </div>
        <form id="roomForm">
            <input type="hidden" id="roomId">
            <div class="form-group"><label>房间号</label><input type="text" id="roomNo" required></div>
            <div class="form-group"><label>楼栋</label><input type="text" id="building"></div>
            <div class="form-group"><label>楼层</label><input type="number" id="floor"></div>
            <div class="form-group"><label>房型</label>
                <select id="roomType">
                    <option value="单人间">单人间</option>
                    <option value="双人间">双人间</option>
                    <option value="三人间">三人间</option>
                </select>
            </div>
            <div class="form-group"><label>容纳人数</label><input type="number" id="capacity" required></div>
            <div class="form-group"><label>月租(元)</label><input type="number" step="0.01" id="price" required></div>
            <div class="form-group"><label>状态（已满由系统自动判断）</label>
                <select id="status">
                    <option value="AVAILABLE">空闲</option>
                    <option value="MAINTENANCE">维修中</option>
                </select>
            </div>
            <div class="form-group"><label>描述</label><textarea id="description" rows="2"></textarea></div>
        </form>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveRoom()">保存</button>
        </div>
    </div>
</div>

<script>
    let currentEditId = null;

    function loadRooms() {
        fetch('/room/list')
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) renderRooms(data.data.list);
            });
    }

    function renderRooms(rooms) {
        const tbody = document.getElementById('roomTableBody');
        tbody.innerHTML = '';
        rooms.forEach(room => {
            let statusClass = '';
            let statusText = '';
            if (room.status === 'AVAILABLE') { statusClass = 'status-available'; statusText = '空闲'; }
            else if (room.status === 'FULL') { statusClass = 'status-full'; statusText = '已满'; }
            else { statusClass = 'status-maintenance'; statusText = '维修'; }
            const row = `<tr>
                    <td>${room.roomNo}</td><td>${room.building || '-'}</td><td>${room.floor || '-'}</td>
                    <td>${room.roomType || '-'}</td><td>${room.capacity}</td><td>${room.occupied}</td>
                    <td>${room.price}</td><td class="${statusClass}">${statusText}</td>
                    <td><button class="btn btn-warning" onclick="editRoom(${room.id})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteRoom(${room.id})">删除</button></td>
                </tr>`;
            tbody.innerHTML += row;
        });
    }

    function showAddModal() {
        currentEditId = null;
        document.getElementById('modalTitle').innerText = '添加房间';
        document.getElementById('roomForm').reset();
        document.getElementById('roomId').value = '';
        document.getElementById('modal').style.display = 'flex';
    }

    function editRoom(id) {
        currentEditId = id;
        fetch('/room/list')
            .then(res => res.json())
            .then(data => {
                const room = data.data.list.find(r => r.id === id);
                if (room) {
                    document.getElementById('modalTitle').innerText = '编辑房间';
                    document.getElementById('roomId').value = room.id;
                    document.getElementById('roomNo').value = room.roomNo || '';
                    document.getElementById('building').value = room.building || '';
                    document.getElementById('floor').value = room.floor || '';
                    document.getElementById('roomType').value = room.roomType || '单人间';
                    document.getElementById('capacity').value = room.capacity || '';
                    document.getElementById('price').value = room.price || '';
                    // FULL是自动状态，编辑时显示为空闲（维修状态才显示维修）
                    document.getElementById('status').value = room.status === 'MAINTENANCE' ? 'MAINTENANCE' : 'AVAILABLE';
                    document.getElementById('description').value = room.description || '';
                    document.getElementById('modal').style.display = 'flex';
                }
            });
    }

    function saveRoom() {
        const strOrNull = (v) => v && v.trim() ? v.trim() : null;
        const intOrNull = (v) => { const p = parseInt(v); return isNaN(p) ? null : p; };
        const floatOrNull = (v) => { const p = parseFloat(v); return isNaN(p) ? null : p; };

        const room = {
            id: intOrNull(document.getElementById('roomId').value),
            roomNo: document.getElementById('roomNo').value,
            building: strOrNull(document.getElementById('building').value),
            floor: intOrNull(document.getElementById('floor').value),
            roomType: document.getElementById('roomType').value,
            capacity: parseInt(document.getElementById('capacity').value),
            price: floatOrNull(document.getElementById('price').value),
            status: document.getElementById('status').value,
            description: strOrNull(document.getElementById('description').value)
        };
        const url = room.id ? '/room/update' : '/room/add';
        const method = room.id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(room)
        })
            .then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
            .then(data => {
                alert(data.message);
                if (data.code === 200) {
                    closeModal();
                    loadRooms();
                }
            })
            .catch(err => { alert('请求失败：'+err.message); });
    }

    function deleteRoom(id) {
        if (confirm('确定删除该房间吗？')) {
            fetch(`/room/delete/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    if (data.code === 200) loadRooms();
                });
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    loadRooms();
</script>
</body>
</html>
