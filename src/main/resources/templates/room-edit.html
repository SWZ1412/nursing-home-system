<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑房间 - 养老院管理系统</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<div class="main-content">
    <div class="page-header">
        <h2>编辑房间</h2>
        <a href="/room" class="btn">返回列表</a>
    </div>
    <form id="editForm" class="form" th:object="${room}">
        <input type="hidden" id="id" th:value="${room.id}">
        <div class="form-group">
            <label>房间号</label>
            <input type="text" id="roomNo" th:value="${room.roomNo}" required>
        </div>
        <div class="form-group">
            <label>楼栋</label>
            <input type="text" id="building" th:value="${room.building}">
        </div>
        <div class="form-group">
            <label>楼层</label>
            <input type="number" id="floor" th:value="${room.floor}">
        </div>
        <div class="form-group">
            <label>房型</label>
            <select id="roomType">
                <option value="单人间" th:selected="${room.roomType == '单人间'}">单人间</option>
                <option value="双人间" th:selected="${room.roomType == '双人间'}">双人间</option>
                <option value="三人间" th:selected="${room.roomType == '三人间'}">三人间</option>
            </select>
        </div>
        <div class="form-group">
            <label>容纳人数</label>
            <input type="number" id="capacity" th:value="${room.capacity}" required>
        </div>
        <div class="form-group">
            <label>月租(元)</label>
            <input type="number" step="0.01" id="price" th:value="${room.price}" required>
        </div>
        <div class="form-group">
            <label>状态（已满由系统自动判断）</label>
            <select id="status">
                <option value="AVAILABLE" th:selected="${room.status != 'MAINTENANCE'}">空闲</option>
                <option value="MAINTENANCE" th:selected="${room.status == 'MAINTENANCE'}">维修中</option>
            </select>
        </div>
        <div class="form-group">
            <label>描述</label>
            <textarea id="description" th:text="${room.description}"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">保存修改</button>
    </form>
</div>

<script>
    document.getElementById('editForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const intOrNull = (v) => { const p = parseInt(v); return isNaN(p) ? null : p; };
        const floatOrNull = (v) => { const p = parseFloat(v); return isNaN(p) ? null : p; };
        const data = {
            id: intOrNull(document.getElementById('id').value),
            roomNo: document.getElementById('roomNo').value,
            building: document.getElementById('building').value,
            floor: intOrNull(document.getElementById('floor').value),
            roomType: document.getElementById('roomType').value,
            capacity: parseInt(document.getElementById('capacity').value),
            price: floatOrNull(document.getElementById('price').value),
            status: document.getElementById('status').value,
            description: document.getElementById('description').value
        };
        fetch('/room/update', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(r => {
            if(!r.ok) throw new Error('HTTP '+r.status);
            return r.json();
        }).then(d => {
            alert(d.message);
            if (d.code === 200) window.location.href = '/room';
        }).catch(err => {
            alert('请求失败：'+err.message);
        });
    });
</script>
</body>
</html>
